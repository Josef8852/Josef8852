<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 160 220" width="140" height="200">
  <title>Pixel Art Tux</title>

  <style>
    @keyframes waddle {
      0%,  100% { transform: rotate(0deg)  translateY(0px);  }
      25%        { transform: rotate(-3deg) translateY(-6px); }
      50%        { transform: rotate(0deg)  translateY(0px);  }
      75%        { transform: rotate(3deg)  translateY(-6px); }
    }
    @keyframes blink {
      0%, 85%, 100% { fill: #F0F0F0; }
      90%, 96%      { fill: #111827; }
    }
    .tux {
      transform-box: fill-box;
      transform-origin: bottom center;
      animation: waddle 2s ease-in-out infinite;
    }
    .eye-bg {
      animation: blink 5s ease-in-out infinite;
    }
  </style>

  <g class="tux">

    <!-- ── BLACK body ── -->
    <g fill="#111827">
      <!-- Row 0: cols 3-10 -->
      <rect x="30"  y="0"   width="80"  height="10"/>
      <!-- Row 1: cols 2-11 -->
      <rect x="20"  y="10"  width="100" height="10"/>
      <!-- Rows 2-3: cols 1-12 -->
      <rect x="10"  y="20"  width="120" height="20"/>
      <!-- Rows 4-5: cols 1-2 | 5-8 | 11-12  (eye gap at 3-4 and 9-10) -->
      <rect x="10"  y="40"  width="20"  height="20"/>
      <rect x="50"  y="40"  width="40"  height="20"/>
      <rect x="110" y="40"  width="20"  height="20"/>
      <!-- Rows 6-7: cols 1-4 | 9-12  (beak gap at 5-8) -->
      <rect x="10"  y="60"  width="40"  height="20"/>
      <rect x="90"  y="60"  width="40"  height="20"/>
      <!-- Row 8: cols 1-12 -->
      <rect x="10"  y="80"  width="120" height="10"/>
      <!-- Row 9: cols 0-2 | 11-13 -->
      <rect x="0"   y="90"  width="30"  height="10"/>
      <rect x="110" y="90"  width="30"  height="10"/>
      <!-- Rows 10-13: cols 0-1 | 12-13 -->
      <rect x="0"   y="100" width="20"  height="40"/>
      <rect x="120" y="100" width="20"  height="40"/>
      <!-- Row 14: cols 0-2 | 11-13 -->
      <rect x="0"   y="140" width="30"  height="10"/>
      <rect x="110" y="140" width="30"  height="10"/>
      <!-- Rows 15-16: cols 1-12 -->
      <rect x="10"  y="150" width="120" height="20"/>
      <!-- Row 17: legs at cols 3-4 and 9-10 -->
      <rect x="30"  y="170" width="20"  height="10"/>
      <rect x="90"  y="170" width="20"  height="10"/>
    </g>

    <!-- ── WHITE eyes (animated blink) ── -->
    <rect class="eye-bg" x="30" y="40" width="20" height="20" fill="#F0F0F0"/>
    <rect class="eye-bg" x="90" y="40" width="20" height="20" fill="#F0F0F0"/>

    <!-- ── WHITE belly ── -->
    <g fill="#F0F0F0">
      <!-- Row 9: belly top cols 3-10 -->
      <rect x="30"  y="90"  width="80"  height="10"/>
      <!-- Rows 10-13: belly cols 2-11 -->
      <rect x="20"  y="100" width="100" height="40"/>
      <!-- Row 14: belly bottom cols 3-10 -->
      <rect x="30"  y="140" width="80"  height="10"/>
    </g>

    <!-- ── BLACK eye pupils (drawn on top of whites) ── -->
    <g fill="#111827">
      <!-- left pupil: col 4, row 4 -->
      <rect x="40" y="40" width="10" height="10"/>
      <!-- right pupil: col 9, row 4 -->
      <rect x="90" y="40" width="10" height="10"/>
    </g>

    <!-- ── YELLOW beak + feet ── -->
    <g fill="#F5C518">
      <!-- Beak rows 6-7: cols 5-8 -->
      <rect x="50"  y="60"  width="40" height="20"/>
      <!-- Row 17: toe tips cols 1-2 and 11-12 -->
      <rect x="10"  y="170" width="20" height="10"/>
      <rect x="110" y="170" width="20" height="10"/>
      <!-- Rows 18-19: left foot cols 1-5 -->
      <rect x="10"  y="180" width="50" height="20"/>
      <!-- Rows 18-19: right foot cols 8-12 -->
      <rect x="80"  y="180" width="50" height="20"/>
    </g>

  </g>
</svg>
